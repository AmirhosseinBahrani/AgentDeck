[package]
name = "agentdeck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AgentDeck — run and supervise a team of Claude agents"
authors = ["Amirhossein Bahrani"]

[lints]
workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which matters on Windows.
name = "agentdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
deck-core = { workspace = true }
deck-supervisor = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
