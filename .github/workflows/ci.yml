name: CI

# macOS runners bill at 10x the minute rate, so PRs run on Linux only and the macOS jobs run on
# push to main. Linux and macOS share this project's entire Unix code path — the ProcessGroup
# trait has one shared unix impl — so PR feedback loses almost nothing, while macOS-specific
# breakage is still caught before it accumulates.
#
# Running the full matrix on every PR consumed the account's Actions allowance within a day.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # deck-core and deck-supervisor deliberately do not depend on Tauri, so the tests that
      # matter run without any system webview libraries installed.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p deck-core -p deck-supervisor --all-targets

      - name: Test
        run: cargo test -p deck-core -p deck-supervisor

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # Only on main, and manually when a change warrants it. This is the job that verifies the
  # actual shipping target, so it must not be removed outright — just run less often.
  macos:
    name: core + app (macos)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test core on the shipping platform
        run: cargo test -p deck-core -p deck-supervisor

      # Compile-only: verifies the IPC surface and Tauri wiring without bundling or signing.
      - name: Build the app
        run: cargo build -p agentdeck
