name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the shipping target for v0.1. Linux runs too because it shares the
        # entire Unix process path, so it catches portability breaks for free.
        # Windows lands with the Job Object ProcessGroup impl in v0.2.
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # deck-core and deck-supervisor deliberately do not depend on Tauri, so the tests
      # that matter run without any system webview libraries installed.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p deck-core -p deck-supervisor --all-targets

      - name: Test
        run: cargo test -p deck-core -p deck-supervisor

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  app:
    name: tauri app (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Compile-only: verifies the IPC surface and Tauri wiring without bundling or signing.
      - run: cargo build -p agentdeck
